<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>한자 뿌리찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211d18;
    --ink-soft:#4a423a;
    --paper:#e9dfc3;
    --paper-deep:#d8c9a0;
    --paper-card:#f3ecd8;
    --seal:#b03a2c;
    --seal-dark:#8c2c21;
    --jade:#4b6357;
    --jade-soft:#7c9488;
    --gold:#a9823e;
    --line:rgba(33,29,24,0.16);
    --shadow:0 10px 26px rgba(33,29,24,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.35), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(0,0,0,0.06), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', 'Malgun Gothic', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .hanja-font{font-family:'Noto Serif KR', serif;}
  #app{
    max-width:980px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom:26px;
  }
  header h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(28px,5vw,42px);
    margin:0 0 6px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  header p.sub{
    margin:0 0 18px;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.6;
  }
  .diff-toggle{
    display:inline-flex;
    background:var(--paper-deep);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  .diff-toggle button{
    border:none;
    background:transparent;
    padding:9px 20px;
    border-radius:999px;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .diff-toggle button.active{
    background:var(--ink);
    color:var(--paper);
  }

  /* ---------- select view ---------- */
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(96px,1fr));
    gap:12px;
  }
  .tile{
    position:relative;
    aspect-ratio:1/1;
    background:var(--paper-card);
    border:2px solid var(--ink);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .tile:hover{transform:translateY(-3px);}
  .tile:active{transform:translateY(0px) scale(.98);}
  .tile .glyph{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(30px,5vw,38px);
    line-height:1;
    color:var(--ink);
  }
  .tile .reading{
    margin-top:6px;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .tile .done-mark{
    position:absolute;
    top:6px;
    right:6px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--seal);
    color:var(--paper-card);
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    transform:rotate(-12deg);
    box-shadow:0 2px 4px rgba(0,0,0,.3);
  }

  /* ---------- map view ---------- */
  #mapview{display:none;}
  .map-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .back-btn{
    border:none;
    background:none;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:8px 4px;
  }
  .back-btn:hover{color:var(--ink);}
  .progress-pill{
    font-weight:700;
    font-size:13px;
    background:var(--paper-deep);
    padding:6px 14px;
    border-radius:999px;
    color:var(--ink);
  }

  .mapstage{
    position:relative;
    width:100%;
    max-width:640px;
    aspect-ratio:1/1;
    margin:0 auto 22px;
  }
  .mapstage svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}

  .node.center{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:22%;
    aspect-ratio:1/1;
    border:3px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 0 0 6px rgba(176,58,44,0.14), var(--shadow);
    z-index:3;
  }
  .node.center .glyph{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(26px,6vw,40px);
    line-height:1;
  }
  .node.center .reading{
    font-size:11px;
    margin-top:4px;
    opacity:.85;
  }

  .node-wrap{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;
  }
  .node-wrap .ring{
    width:clamp(46px,13vw,64px);
    height:clamp(46px,13vw,64px);
    border-radius:50%;
    border:2px dashed var(--jade-soft);
    background:var(--paper-card);
    color:var(--jade);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:clamp(16px,4vw,22px);
  }
  .node-wrap.solved .ring{
    border:2px solid var(--seal);
    color:var(--seal-dark);
    box-shadow:0 4px 10px rgba(176,58,44,0.25);
  }
  .node-wrap .caption{
    margin-top:4px;
    text-align:center;
    line-height:1.2;
  }
  .node-wrap .caption .emoji{
    display:block;
    font-size:clamp(14px,3.6vw,18px);
  }
  .node-wrap .caption .word{
    display:block;
    font-size:clamp(9px,2.4vw,11px);
    font-weight:700;
    color:var(--ink-soft);
  }
  @keyframes stampPop{
    0%{transform:scale(0.5); opacity:.4;}
    55%{transform:scale(1.2);}
    100%{transform:scale(1); opacity:1;}
  }
  .node-wrap.just-solved .ring{animation:stampPop .45s ease;}

  .clue-wrap{
    max-width:520px;
    margin:0 auto;
  }
  .clue-card{
    background:var(--paper-card);
    border:2px solid var(--ink);
    border-radius:12px;
    padding:18px 20px;
    text-align:center;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .clue-card .label{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:8px;
  }
  .clue-card .def{
    font-size:clamp(16px,3.4vw,19px);
    font-weight:500;
    line-height:1.5;
  }
  .clue-card.wrong-flash{border-color:var(--seal); }

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .opt-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px 10px;
    border-radius:10px;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .opt-btn:hover{background:var(--paper-card);}
  .opt-btn:active{transform:scale(.97);}
  .opt-btn.correct-flash{background:var(--jade); color:var(--paper); border-color:var(--jade);}
  .opt-btn.wrong-shake{animation:shake .4s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  .complete-panel{
    max-width:520px;
    margin:0 auto;
    text-align:center;
    background:var(--paper-card);
    border:2px solid var(--seal);
    border-radius:12px;
    padding:26px 20px;
    box-shadow:var(--shadow);
  }
  .complete-panel .seal-word{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:30px;
    color:var(--seal);
    border:4px solid var(--seal);
    border-radius:10px;
    display:inline-block;
    padding:6px 14px;
    transform:rotate(-6deg);
    margin-bottom:14px;
  }
  .complete-panel p{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 18px;
    line-height:1.6;
  }
  .complete-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .pbtn{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 18px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  .pbtn.secondary{
    background:transparent;
    color:var(--ink);
  }

  /* ---------- big reveal overlay ---------- */
  .reveal-overlay{
    position:fixed;
    inset:0;
    background:rgba(33,29,24,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    opacity:0;
    transition:opacity .25s ease;
    padding:20px;
  }
  .reveal-overlay.show{opacity:1;}
  .reveal-overlay.hide{opacity:0;}
  .reveal-card{
    background:var(--paper-card);
    border:4px solid var(--seal);
    border-radius:18px;
    padding:30px 34px;
    text-align:center;
    max-width:320px;
    box-shadow:0 20px 44px rgba(0,0,0,0.35);
    transform:scale(.7);
    transition:transform .32s cubic-bezier(.34,1.56,.64,1);
  }
  .reveal-overlay.show .reveal-card{transform:scale(1);}
  .reveal-card .reveal-emoji{font-size:44px; margin-bottom:4px;}
  .reveal-card .reveal-hanja{
    font-weight:900;
    font-size:clamp(46px,14vw,64px);
    color:var(--seal);
    line-height:1;
  }
  .reveal-card .reveal-hangul{
    font-size:20px;
    font-weight:700;
    margin-top:8px;
    color:var(--ink);
  }
  .reveal-card .reveal-def{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:12px;
    line-height:1.5;
  }

  @media (max-width:480px){
    .node.center{width:26%;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>한자, 뿌리를 찾다</h1>
    <p class="sub">한 글자 한자를 고르면, 그 한자에서 자라난 낱말들이 마인드맵으로 펼쳐집니다.<br>뜻을 보고 알맞은 낱말을 찾아 가지를 완성해 보세요.</p>
    <div class="diff-toggle" id="diffToggle">
      <button data-lv="mid" class="active">중학생</button>
      <button data-lv="high">고등학생</button>
    </div>
  </header>

  <main>
    <section id="selectview">
      <div id="grid"></div>
    </section>

    <section id="mapview">
      <div class="map-topbar">
        <button class="back-btn" id="backBtn">← 다른 한자 고르기</button>
        <div class="progress-pill" id="progressPill">0 / 0</div>
      </div>
      <div class="mapstage" id="mapstage"></div>
      <div class="clue-wrap" id="clueWrap"></div>
    </section>
  </main>
</div>

    {char:'山', reading:'메 산', words:[

    {char:'國', reading:'나라 국', words:[

      {w:'애국', h:'愛國', e:'🎌', def:'자기 나라를 사랑함', lv:'중'},
      {w:'국력', h:'國力', e:'🛡️', def:'한 나라가 가진 정치·경제·군사적인 힘', lv:'고'},
      {w:'망국', h:'亡國', e:'🏚️', def:'나라가 망함, 또는 망한 나라', lv:'고'},
    ]},
    {char:'家', reading:'집 가', words:[
      {w:'가족', h:'家族', e:'👨‍👩‍👧‍👦', def:'부모와 자식처럼 한 집에서 함께 사는 사람들', lv:'중'},
      {w:'가정', h:'家庭', e:'🏠', def:'한 가족이 생활하는 집안', lv:'중'},
      {w:'작가', h:'作家', e:'✍️', def:'글이나 예술 작품을 창작하는 사람', lv:'중'},
      {w:'화가', h:'畵家', e:'🎨', def:'그림을 그리는 것을 직업으로 하는 사람', lv:'중'},
      {w:'가옥', h:'家屋', e:'🏡', def:'사람이 사는 집', lv:'고'},
    ]},
    {char:'愛', reading:'사랑 애', words:[
      {w:'애정', h:'愛情', e:'💞', def:'누군가를 사랑하는 따뜻한 마음', lv:'중'},
      {w:'애인', h:'愛人', e:'💑', def:'서로 사랑하는 관계에 있는 사람', lv:'중'},
      {w:'자애', h:'慈愛', e:'🤱', def:'윗사람이 아랫사람에게 베푸는 깊은 사랑', lv:'중'},
      {w:'열애', h:'熱愛', e:'😍', def:'매우 뜨겁게 사랑함', lv:'고'},
      {w:'편애', h:'偏愛', e:'⚖️', def:'여럿 중에서 한쪽만 치우쳐 사랑함', lv:'고'},
    ]},
    {char:'和', reading:'화할 화', words:[
      {w:'평화', h:'平和', e:'🕊️', def:'다툼 없이 조용하고 화목한 상태', lv:'중'},
      {w:'화합', h:'和合', e:'🤝', def:'서로 뜻이 맞아 사이좋게 어울림', lv:'중'},
      {w:'조화', h:'調和', e:'🎶', def:'서로 잘 어우러져 균형을 이룸', lv:'중'},
      {w:'화해', h:'和解', e:'🤗', def:'다투던 것을 멈추고 사이좋게 지냄', lv:'중'},
      {w:'온화', h:'溫和', e:'🌸', def:'성격이나 날씨가 부드럽고 따뜻함', lv:'고'},
    ]},
    {char:'安', reading:'편안 안', words:[
      {w:'안전', h:'安全', e:'🦺', def:'위험한 일이 생길 염려가 없음', lv:'중'},
      {w:'안정', h:'安定', e:'⚖️', def:'바뀌지 않고 편안한 상태를 유지함', lv:'중'},
      {w:'불안', h:'不安', e:'😰', def:'마음이 편하지 않고 걱정스러움', lv:'중'},
      {w:'안녕', h:'安寧', e:'👋', def:'아무 탈 없이 편안함', lv:'중'},
      {w:'치안', h:'治安', e:'👮', def:'사회의 안전과 질서를 유지하는 일', lv:'고'},
    ]},
    {char:'全', reading:'온전 전', words:[
      {w:'전체', h:'全體', e:'🧩', def:'부분을 다 합친 것 모두', lv:'중'},
      {w:'완전', h:'完全', e:'💯', def:'부족함이나 흠이 없이 모두 갖춤', lv:'중'},
      {w:'전국', h:'全國', e:'🗾', def:'한 나라의 영토 전체', lv:'중'},
      {w:'전액', h:'全額', e:'💰', def:'전체 액수, 정해진 돈 모두', lv:'고'},
      {w:'전멸', h:'全滅', e:'☠️', def:'하나도 남지 않고 모두 죽거나 없어짐', lv:'고'},
    ]},
  ];

  const state = {
    difficulty: 'mid',       // 'mid' | 'high'
    view: 'select',          // 'select' | 'map'
    activeCharIndex: null,
    progress: {}             // charIndex -> { solved: Set<string>, currentClue: word|null }
  };

  function getProgress(idx){
    if(!state.progress[idx]) state.progress[idx] = {solved:new Set(), currentClue:null};
    return state.progress[idx];
  }

  function activeWords(charObj){
    return state.difficulty === 'mid'
      ? charObj.words.filter(w => w.lv === '중')
      : charObj.words;
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // distractors are drawn ONLY from the same center-character's own word family,
  // so every option shares the same root hanja and the quiz has to be solved by meaning.
  function pickDistractors(charObj, correctWord, count){
    const pool = charObj.words.map(w=>w.w).filter(w => w !== correctWord.w);
    return shuffle(pool).slice(0, count);
  }

  // ---------- SELECT VIEW ----------
  const gridEl = document.getElementById('grid');
  const selectViewEl = document.getElementById('selectview');
  const mapViewEl = document.getElementById('mapview');

  function renderSelectView(){
    gridEl.innerHTML = '';
    DATA.forEach((c, idx)=>{
      const words = activeWords(c);
      const prog = getProgress(idx);
      const done = words.length>0 && words.every(w=>prog.solved.has(w.w));

      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML =
        '<div class="glyph hanja-font">'+c.char+'</div>' +
        '<div class="reading">'+c.reading+'</div>' +
        (done ? '<div class="done-mark">完</div>' : '');
      tile.addEventListener('click', ()=>{
        state.activeCharIndex = idx;
        state.view = 'map';
        showMapView();
      });
      gridEl.appendChild(tile);
    });
  }

  // ---------- MAP VIEW ----------
  const mapstageEl = document.getElementById('mapstage');
  const clueWrapEl = document.getElementById('clueWrap');
  const progressPillEl = document.getElementById('progressPill');
  const backBtn = document.getElementById('backBtn');

  backBtn.addEventListener('click', ()=>{
    state.view = 'select';
    showSelectView();
  });

  function showSelectView(){
    selectViewEl.style.display = 'block';
    mapViewEl.style.display = 'none';
    renderSelectView();
  }

  function showMapView(){
    selectViewEl.style.display = 'none';
    mapViewEl.style.display = 'block';
    renderMapView();
  }

  function renderMapView(){
    const idx = state.activeCharIndex;
    const c = DATA[idx];
    const words = activeWords(c);
    const prog = getProgress(idx);
    const solvedCount = words.filter(w=>prog.solved.has(w.w)).length;

    progressPillEl.textContent = solvedCount + ' / ' + words.length;

    const N = words.length;
    const cx = 50, cy = 50; // percent
    const R = 38; // percent radius for slot centers

    let svgLines = '';
    let nodesHtml = '<div class="node center"><div class="glyph hanja-font">'+c.char+'</div><div class="reading">'+c.reading+'</div></div>';

    words.forEach((w, i)=>{
      const angle = (-90 + i * (360/N)) * Math.PI/180;
      const x = cx + R*Math.cos(angle);
      const y = cy + R*Math.sin(angle);
      const solved = prog.solved.has(w.w);
      svgLines += '<line x1="'+cx+'%" y1="'+cy+'%" x2="'+x+'%" y2="'+y+'%" stroke="'+(solved?'var(--seal)':'var(--jade-soft)')+'" stroke-width="'+(solved?2.5:1.5)+'" stroke-dasharray="'+(solved?'0':'4,5')+'" />';

      nodesHtml += '<div class="node-wrap'+(solved?' solved':'')+'" data-word="'+w.w+'" style="left:'+x+'%; top:'+y+'%;">' +
        '<div class="ring hanja-font">'+(solved ? w.h : '?')+'</div>' +
        (solved ? '<div class="caption"><span class="emoji">'+w.e+'</span><span class="word">'+w.w+'</span></div>' : '') +
        '</div>';
    });

    mapstageEl.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">'+svgLines+'</svg>' + nodesHtml;

    const unsolved = words.filter(w=>!prog.solved.has(w.w));
    if(unsolved.length === 0){
      renderComplete(c, words.length);
      return;
    }
    if(!prog.currentClue || prog.solved.has(prog.currentClue.w)){
      prog.currentClue = unsolved[Math.floor(Math.random()*unsolved.length)];
    }
    renderClue(c, prog.currentClue);
  }

  function renderClue(charObj, word){
    const distractors = pickDistractors(charObj, word, 3);
    const options = shuffle([word.w, ...distractors]);

    clueWrapEl.innerHTML =
      '<div class="clue-card" id="clueCard">' +
        '<div class="label">이 뜻을 가진 낱말은?</div>' +
        '<div class="def">'+word.def+'</div>' +
      '</div>' +
      '<div class="options" id="optionsRow"></div>';

    const optionsRow = document.getElementById('optionsRow');
    options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.addEventListener('click', ()=> handleAnswer(opt, word, btn));
      optionsRow.appendChild(btn);
    });
  }

  function handleAnswer(chosen, word, btnEl){
    const clueCard = document.getElementById('clueCard');

    if(chosen === word.w){
      const idx = state.activeCharIndex;
      const prog = getProgress(idx);
      btnEl.classList.add('correct-flash');
      prog.solved.add(word.w);

      showBigReveal(word, ()=>{
        renderMapView();
        requestAnimationFrame(()=>{
          const newNode = mapstageEl.querySelector('.node-wrap[data-word="'+CSS.escape(word.w)+'"]');
          if(newNode){
            newNode.classList.add('just-solved');
            setTimeout(()=>newNode.classList.remove('just-solved'), 500);
          }
        });
      });
    }else{
      btnEl.classList.add('wrong-shake');
      if(clueCard) clueCard.classList.add('wrong-flash');
      setTimeout(()=>{
        btnEl.classList.remove('wrong-shake');
        if(clueCard) clueCard.classList.remove('wrong-flash');
      }, 420);
    }
  }

  function showBigReveal(word, onDone){
    const overlay = document.createElement('div');
    overlay.className = 'reveal-overlay';
    overlay.innerHTML =
      '<div class="reveal-card">' +
        '<div class="reveal-emoji">'+word.e+'</div>' +
        '<div class="reveal-hanja hanja-font">'+word.h+'</div>' +
        '<div class="reveal-hangul">'+word.w+'</div>' +
        '<div class="reveal-def">'+word.def+'</div>' +
      '</div>';
    document.body.appendChild(overlay);
    requestAnimationFrame(()=> overlay.classList.add('show'));
    setTimeout(()=>{
      overlay.classList.add('hide');
      setTimeout(()=>{
        overlay.remove();
        if(onDone) onDone();
      }, 260);
    }, 1250);
  }

  function renderComplete(c, total){
    clueWrapEl.innerHTML =
      '<div class="complete-panel">' +
        '<div class="seal-word hanja-font">完</div>' +
        '<p>‘'+c.char+'(' + c.reading + ')’에서 자라난 낱말 '+total+'개를 모두 찾았어요.</p>' +
        '<div class="complete-actions">' +
          '<button class="pbtn" id="toSelectBtn">다른 한자 고르기</button>' +
          '<button class="pbtn secondary" id="retryBtn">다시 도전하기</button>' +
        '</div>' +
      '</div>';
    document.getElementById('toSelectBtn').addEventListener('click', ()=>{
      state.view = 'select';
      showSelectView();
    });
    document.getElementById('retryBtn').addEventListener('click', ()=>{
      const idx = state.activeCharIndex;
      state.progress[idx] = {solved:new Set(), currentClue:null};
      renderMapView();
    });
  }

  // ---------- difficulty toggle ----------
  const diffToggle = document.getElementById('diffToggle');
  diffToggle.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-lv]');
    if(!btn) return;
    const lv = btn.getAttribute('data-lv');
    if(lv === state.difficulty) return;
    state.difficulty = lv;
    [...diffToggle.children].forEach(b=>b.classList.toggle('active', b===btn));
    if(state.view === 'select'){
      renderSelectView();
    }else{
      renderMapView();
    }
  });

  // ---------- init ----------
  showSelectView();
})();
</script>
