<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>병음 성모·운모 단어 짝 맞추기</title>
<style>
  :root{
    --ink:#1F3A3D;
    --ink-dark:#152A2C;
    --cream:#FBF3E3;
    --cream-2:#F3E9D4;
    --paper:#FFFDF8;
    --red:#D6432F;
    --red-dark:#B5341F;
    --jade:#4C9A8A;
    --jade-dark:#397A6D;
    --gold:#E3A93B;
    --text:#24312E;
    --text-soft:#5B6B63;
    --white:#FFFFFF;
    --shadow: 0 10px 24px rgba(21,42,44,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(227,169,59,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(214,67,47,0.12), transparent 45%);
    color:var(--text);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    max-width:920px;
    margin:0 auto;
    padding:28px 18px 60px;
    min-height:100vh;
  }
  button{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- shared bits ---------- */
  .top-badge{
    display:inline-block;
    color:var(--gold);
    font-size:13px;
    letter-spacing:0.03em;
    font-weight:600;
    margin-bottom:6px;
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:28px;
  }
  h1.brand{
    color:var(--cream);
    font-size:26px;
    font-weight:800;
    margin:0;
  }
  h1.brand em{
    font-style:normal;
    color:var(--red);
  }

  .icon-btn{
    background:transparent;
    border:1px solid rgba(251,243,227,0.35);
    color:var(--cream);
    border-radius:999px;
    padding:8px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .icon-btn:hover{background:rgba(251,243,227,0.1);}
  .icon-btn:active{transform:scale(0.96);}

  /* ---------- HOME SCREEN ---------- */
  .home-hero{
    background:var(--cream);
    border-radius:20px;
    padding:32px 28px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    margin-bottom:22px;
  }
  .home-hero::after{
    content:"汉";
    position:absolute;
    right:-10px;
    bottom:-40px;
    font-size:180px;
    font-weight:900;
    color:rgba(31,58,61,0.05);
    line-height:1;
    pointer-events:none;
  }
  .home-hero h2{
    margin:0 0 8px;
    font-size:28px;
    line-height:1.35;
    color:var(--ink);
  }
  .home-hero p{
    margin:0;
    color:var(--text-soft);
    font-size:15px;
    line-height:1.6;
    max-width:56ch;
  }

  .mode-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin:26px 0 22px;
  }
  @media (max-width:620px){
    .mode-grid{grid-template-columns:1fr;}
  }
  .mode-card{
    position:relative;
    background:var(--paper);
    border-radius:14px;
    padding:22px 20px 20px;
    cursor:pointer;
    border:2px solid transparent;
    box-shadow:0 6px 16px rgba(21,42,44,0.14);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .mode-card:nth-child(1){transform:rotate(-1.4deg);}
  .mode-card:nth-child(2){transform:rotate(1.4deg);}
  .mode-card:hover{transform:rotate(0deg) translateY(-3px);}
  .mode-card.active{
    border-color:var(--red);
    box-shadow:0 10px 22px rgba(214,67,47,0.25);
  }
  .mode-card .ring{
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%);
    width:18px;height:18px;
    border-radius:50%;
    background:var(--ink);
    border:4px solid var(--cream-2);
  }
  .mode-card .tag{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--red);
    background:rgba(214,67,47,0.1);
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .mode-card h3{
    margin:0 0 8px;
    font-size:19px;
    color:var(--ink);
  }
  .mode-card p{
    margin:0;
    font-size:13.5px;
    color:var(--text-soft);
    line-height:1.55;
  }
  .mode-card .glyphs{
    margin-top:14px;
    font-size:26px;
    letter-spacing:6px;
  }

  .count-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .count-row .label{
    color:var(--cream);
    font-size:14px;
    font-weight:600;
    margin-right:4px;
  }
  .count-chip{
    border:1.5px solid rgba(251,243,227,0.4);
    background:transparent;
    color:var(--cream);
    padding:8px 15px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:all .15s ease;
  }
  .count-chip.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink-dark);
  }

  .start-btn{
    display:block;
    width:100%;
    background:var(--red);
    color:var(--white);
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:800;
    padding:16px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(214,67,47,0.35);
    transition:transform .12s ease, background .15s ease;
  }
  .start-btn:hover{background:var(--red-dark);}
  .start-btn:active{transform:scale(0.985);}

  /* ---------- GAME HEADER (shared) ---------- */
  .game-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .game-header .left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stat-pill{
    background:rgba(251,243,227,0.1);
    border:1px solid rgba(251,243,227,0.25);
    color:var(--cream);
    font-size:13px;
    font-weight:700;
    padding:7px 13px;
    border-radius:999px;
  }
  .stat-pill b{color:var(--gold);}
  .progress-track{
    height:8px;
    background:rgba(251,243,227,0.15);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--red));
    width:0%;
    transition:width .35s ease;
  }

  /* ---------- GAME 1: drag match ---------- */
  .g1-board{
    display:grid;
    grid-template-columns: 1.15fr .85fr;
    gap:22px;
  }
  @media (max-width:700px){
    .g1-board{grid-template-columns:1fr;}
  }
  .tile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(118px,1fr));
    gap:12px;
    align-content:start;
  }
  .tile{
    background:var(--paper);
    border-radius:14px;
    padding:14px 8px 10px;
    text-align:center;
    box-shadow:0 4px 10px rgba(21,42,44,0.16);
    border:2px dashed rgba(31,58,61,0.18);
    min-height:118px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .tile .art{width:64px; height:64px; object-fit:contain;}
  .tile .slot{
    margin-top:8px;
    font-size:13px;
    font-weight:700;
    color:var(--text-soft);
    min-height:16px;
  }
  .tile.drag-over{
    border-color:var(--gold);
    background:#FFF8E8;
    transform:scale(1.03);
  }
  .tile.matched{
    border-style:solid;
    border-color:var(--jade);
    background:#F1FAF7;
  }
  .tile.matched .slot{color:var(--jade-dark);}
  .tile.matched .meaning{
    font-size:11px;
    color:var(--text-soft);
    margin-top:2px;
  }
  .tile.wrong-flash{
    animation:shakeTile .38s ease;
    border-color:var(--red);
  }
  @keyframes shakeTile{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .chip-tray{
    background:rgba(251,243,227,0.08);
    border:1px dashed rgba(251,243,227,0.3);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-content:start;
    min-height:150px;
  }
  .chip{
    touch-action:none;
    user-select:none;
    background:var(--white);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:9px 14px;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    cursor:grab;
    box-shadow:0 3px 0 var(--ink);
    transition:box-shadow .1s ease, transform .1s ease, opacity .2s ease;
  }
  .chip:active{cursor:grabbing;}
  .chip.selected{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink-dark);
    box-shadow:0 3px 0 var(--red-dark);
  }
  .chip.dragging{
    position:fixed;
    z-index:999;
    box-shadow:0 10px 18px rgba(0,0,0,0.35);
    pointer-events:none;
  }
  .chip.matched-away{
    opacity:0;
    transform:scale(.4);
    pointer-events:none;
  }
  .chip.wrong-flash{
    animation:shakeChip .38s ease;
    background:#FBE3DF;
    border-color:var(--red);
  }
  @keyframes shakeChip{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px) rotate(-2deg);}
    75%{transform:translateX(5px) rotate(2deg);}
  }
  .tray-hint{
    width:100%;
    color:var(--cream);
    opacity:.65;
    font-size:12.5px;
    margin:0 0 4px;
  }

  /* ---------- GAME 2: memory flip ---------- */
  .flip-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(96px,1fr));
    gap:12px;
  }
  .card{
    aspect-ratio:3/4;
    perspective:800px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.3,1.1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute;
    inset:0;
    border-radius:12px;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6px;
    text-align:center;
  }
  .card-back{
    background:
      repeating-linear-gradient(135deg, rgba(227,169,59,0.10) 0 6px, transparent 6px 14px),
      var(--ink);
    border:2px solid rgba(227,169,59,0.4);
    box-shadow:0 4px 10px rgba(21,42,44,0.3);
  }
  .card-back::after{
    content:"汉";
    color:rgba(227,169,59,0.55);
    font-size:30px;
    font-weight:900;
  }
  .card-front{
    background:var(--paper);
    transform:rotateY(180deg);
    box-shadow:0 4px 10px rgba(21,42,44,0.2);
    border:2px solid var(--jade);
  }
  .card.card-type-pinyin .card-front{border-color:var(--red);}
  .card-front .art{width:56px; height:56px; object-fit:contain;}
  .card-front .pinyin{
    font-size:16px;
    font-weight:800;
    color:var(--red-dark);
  }
  .card-front .hanzi{
    font-size:13px;
    color:var(--ink);
    margin-top:2px;
  }
  .card-front .meaning{
    font-size:10.5px;
    color:var(--text-soft);
    margin-top:2px;
  }
  .card.matched .card-front{
    border-color:var(--jade);
    background:#F1FAF7;
  }
  .card.matched{cursor:default;}
  .card.matched .card-inner{
    animation:pulseMatch .4s ease;
  }
  @keyframes pulseMatch{
    0%{transform:rotateY(180deg) scale(1);}
    50%{transform:rotateY(180deg) scale(1.08);}
    100%{transform:rotateY(180deg) scale(1);}
  }
  .card.mismatch .card-inner{animation:shakeCard .4s ease;}
  @keyframes shakeCard{
    0%,100%{transform:rotateY(180deg) translateX(0);}
    25%{transform:rotateY(180deg) translateX(-6px);}
    75%{transform:rotateY(180deg) translateX(6px);}
  }

  /* ---------- completion overlay ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(21,42,44,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1200;
  }
  .result-card{
    background:var(--cream);
    border-radius:20px;
    padding:34px 30px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    position:relative;
    overflow:hidden;
  }
  .result-card .big-emoji{font-size:52px; margin-bottom:6px;}
  .result-card h3{
    margin:0 0 6px;
    color:var(--ink);
    font-size:22px;
  }
  .result-card p.sub{
    margin:0 0 18px;
    color:var(--text-soft);
    font-size:14px;
  }
  .result-stats{
    display:flex;
    justify-content:center;
    gap:26px;
    margin-bottom:24px;
  }
  .result-stats div{display:flex; flex-direction:column;}
  .result-stats .num{font-size:22px; font-weight:800; color:var(--red);}
  .result-stats .lbl{font-size:11.5px; color:var(--text-soft); margin-top:2px;}
  .result-actions{display:flex; gap:10px;}
  .result-actions button{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:none;
    font-weight:800;
    font-size:14.5px;
    cursor:pointer;
  }
  .btn-primary{background:var(--red); color:#fff;}
  .btn-secondary{background:var(--white); color:var(--ink); border:1.5px solid var(--ink) !important;}

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:9px;height:14px;
    border-radius:2px;
    z-index:1300;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(105vh) rotate(540deg); opacity:0.9; }
  }
</style>
</head>

    {id:"qi", hanzi:"七", pinyin:"qī", meaning:"7, 일곱", imgKey:"qi"},
    {id:"xi_west", hanzi:"西", pinyin:"xī", meaning:"서쪽", imgKey:"xi_west"},
    {id:"zhe", hanzi:"这", pinyin:"zhè", meaning:"이, 이것", imgKey:"zhe"},
    {id:"chi", hanzi:"吃", pinyin:"chī", meaning:"먹다", imgKey:"chi"},
    {id:"shu_book", hanzi:"书", pinyin:"shū", meaning:"책", imgKey:"shu_book"},
    {id:"re", hanzi:"热", pinyin:"rè", meaning:"덥다", imgKey:"re"},
    {id:"zao", hanzi:"早", pinyin:"zǎo", meaning:"아침", imgKey:"zao"},
    {id:"cai", hanzi:"菜", pinyin:"cài", meaning:"요리, 음식", imgKey:"cai"},
    {id:"si", hanzi:"四", pinyin:"sì", meaning:"4, 넷", imgKey:"si"},
    {id:"xia", hanzi:"下", pinyin:"xià", meaning:"아래", imgKey:"xia"},
    {id:"xie", hanzi:"鞋", pinyin:"xié", meaning:"신발", imgKey:"xie"},
    {id:"xiao", hanzi:"小", pinyin:"xiǎo", meaning:"작다", imgKey:"xiao"},
    {id:"jiu", hanzi:"酒", pinyin:"jiǔ", meaning:"술", imgKey:"jiu"},
    {id:"lian", hanzi:"脸", pinyin:"liǎn", meaning:"얼굴", imgKey:"lian"},
    {id:"jiang", hanzi:"江", pinyin:"jiāng", meaning:"강", imgKey:"jiang"},
    {id:"xiong", hanzi:"熊", pinyin:"xióng", meaning:"곰", imgKey:"xiong"},
    {id:"xin", hanzi:"信", pinyin:"xìn", meaning:"편지", imgKey:"xin"},
    {id:"ping", hanzi:"瓶", pinyin:"píng", meaning:"병", imgKey:"ping"},
    {id:"hanbao", hanzi:"汉堡包", pinyin:"hànbǎobāo", meaning:"햄버거", imgKey:"hanbao"},
    {id:"kafei", hanzi:"咖啡", pinyin:"kāfēi", meaning:"커피", imgKey:"kafei"},
    {id:"kele", hanzi:"可乐", pinyin:"kělè", meaning:"콜라", imgKey:"kele"},
    {id:"niunai", hanzi:"牛奶", pinyin:"niúnǎi", meaning:"우유", imgKey:"niunai"},
    {id:"pijiu", hanzi:"啤酒", pinyin:"píjiǔ", meaning:"맥주", imgKey:"pijiu"}
  ];


  var app = document.getElementById("app");

  var state = { mode: 1, wordCount: 12 };
  var g1 = null; // active game1 session
  var g2 = null; // active game2 session

  /* ============ utils ============ */
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function fmtTime(ms){
    var s = Math.floor(ms/1000);
    var m = Math.floor(s/60);
    s = s % 60;
    return (m>0 ? m+"분 " : "") + s + "초";
  }

  /* ============ HOME ============ */
  function renderHome(){
    g1 = null; g2 = null;
    var counts = [8,12,16,20,VOCAB.length];
    app.innerHTML =
      '<div class="brand-row">' +
        '<h1 class="brand">병음 짝<em>꿍</em> 찾기</h1>' +
      '</div>' +
      '<div class="home-hero">' +
        '<span class="top-badge">성모·운모 예시 단어 + 음료 어휘</span>' +
        '<h2>그림과 발음을 짝지어 보며<br>배운 단어를 확인해요</h2>' +
        '<p>j·q·x·zh·ch·sh 같은 성모와 ia·iao·ian·ing 같은 운모를 배울 때 쓰는 예시 단어 카드, 그리고 음료·음식 카드로 복습하는 두 가지 게임이에요. 학생들이 그림을 보고 알맞은 병음을 연결하거나, 카드를 뒤집어 같은 짝을 찾을 수 있어요. 매번 문제와 순서가 무작위로 섞여요.</p>' +
      '</div>' +
      '<div class="mode-grid">' +
        '<div class="mode-card" data-mode="1" id="modeCard1">' +
          '<div class="ring"></div>' +
          '<span class="tag">끌어서 맞추기</span>' +
          '<h3>그림 - 발음 연결하기</h3>' +
          '<p>그림 카드에 알맞은 병음 칩을 마우스(또는 손가락)로 끌어다 놓아요.</p>' +
          '<div class="glyphs">🐶 → 📌</div>' +
        '</div>' +
        '<div class="mode-card" data-mode="2" id="modeCard2">' +
          '<div class="ring"></div>' +
          '<span class="tag">뒤집어서 맞추기</span>' +
          '<h3>같은 짝 카드 뒤집기</h3>' +
          '<p>카드를 두 장씩 뒤집어 그림과 발음이 같은 짝을 찾아요.</p>' +
          '<div class="glyphs">🀫 🀫</div>' +
        '</div>' +
      '</div>' +
      '<div class="count-row">' +
        '<span class="label">단어 개수</span>' +
        counts.map(function(c){
          return '<button class="count-chip' + (c===state.wordCount ? ' active' : '') + '" data-count="' + c + '">' + c + '개</button>';
        }).join('') +
      '</div>' +
      '<button class="start-btn" id="startBtn">시작하기 ▶</button>';

    document.getElementById("modeCard1").addEventListener("click", function(){ setMode(1); });
    document.getElementById("modeCard2").addEventListener("click", function(){ setMode(2); });
    Array.prototype.forEach.call(document.querySelectorAll(".count-chip"), function(btn){
      btn.addEventListener("click", function(){
        state.wordCount = parseInt(btn.getAttribute("data-count"), 10);
        renderHome();
      });
    });
    document.getElementById("startBtn").addEventListener("click", function(){
      if (state.mode === 1) startGame1(); else startGame2();
    });
    highlightMode();
  }
  function setMode(m){
    state.mode = m;
    highlightMode();
  }
  function highlightMode(){
    var c1 = document.getElementById("modeCard1");
    var c2 = document.getElementById("modeCard2");
    if (!c1) return;
    c1.classList.toggle("active", state.mode === 1);
    c2.classList.toggle("active", state.mode === 2);
  }

  /* ============ GAME 1: drag & drop match ============ */
  function startGame1(){
    var words = shuffle(VOCAB).slice(0, state.wordCount);
    var tiles = shuffle(words);
    var chips = shuffle(words);
    g1 = {
      words: words,
      matched: 0,
      mistakes: 0,
      total: words.length,
      startTime: Date.now(),
      selectedChip: null
    };

    app.innerHTML =
      '<div class="game-header">' +
        '<div class="left">' +
          '<button class="icon-btn" id="backBtn">← 메인으로</button>' +
          '<button class="icon-btn" id="reshuffleBtn">🔀 다시 섞기</button>' +
        '</div>' +
        '<div class="left">' +
          '<span class="stat-pill">맞춘 개수 <b id="matchedStat">0</b> / ' + g1.total + '</span>' +
          '<span class="stat-pill">실수 <b id="missStat">0</b></span>' +
        '</div>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>' +
      '<div class="g1-board">' +
        '<div class="tile-grid" id="tileGrid"></div>' +
        '<div class="chip-tray" id="chipTray">' +
          '<p class="tray-hint">병음 칩을 그림 위로 끌어다 놓아 보세요.</p>' +
        '</div>' +
      '</div>';

    document.getElementById("backBtn").addEventListener("click", renderHome);
    document.getElementById("reshuffleBtn").addEventListener("click", startGame1);

    var tileGrid = document.getElementById("tileGrid");
    tiles.forEach(function(w){
      var t = el(
        '<div class="tile" data-id="' + w.id + '">' +
          '<img class="art" src="' + IMG[w.imgKey] + '" alt="' + w.meaning + '">' +
          '<div class="slot">?</div>' +
        '</div>'
      );
      tileGrid.appendChild(t);
    });

    var chipTray = document.getElementById("chipTray");
    chips.forEach(function(w){
      var c = el(
        '<div class="chip" data-id="' + w.id + '">' + w.pinyin + '</div>'
      );
      chipTray.appendChild(c);
      bindChipDrag(c);
      c.addEventListener("click", function(ev){
        if (c._wasDrag) { c._wasDrag = false; return; }
        onChipTap(c);
      });
    });

    Array.prototype.forEach.call(tileGrid.querySelectorAll(".tile"), function(tileEl){
      tileEl.addEventListener("click", function(){
        if (g1.selectedChip && !tileEl.classList.contains("matched")){
          attemptMatch(g1.selectedChip, tileEl);
        }
      });
    });
  }

  function onChipTap(chipEl){
    if (chipEl.classList.contains("matched-away")) return;
    if (g1.selectedChip === chipEl){
      chipEl.classList.remove("selected");
      g1.selectedChip = null;
      return;
    }
    if (g1.selectedChip) g1.selectedChip.classList.remove("selected");
    g1.selectedChip = chipEl;
    chipEl.classList.add("selected");
  }

  function bindChipDrag(chipEl){
    var startX, startY, offX, offY, moved, origParent, origNext;

    chipEl.addEventListener("pointerdown", function(ev){
      if (chipEl.classList.contains("matched-away")) return;
      chipEl.setPointerCapture(ev.pointerId);
      var rect = chipEl.getBoundingClientRect();
      startX = ev.clientX; startY = ev.clientY;
      offX = ev.clientX - rect.left; offY = ev.clientY - rect.top;
      moved = false;
      origParent = chipEl.parentNode;
      origNext = chipEl.nextSibling;

      function onMove(ev2){
        var dx = ev2.clientX - startX, dy = ev2.clientY - startY;
        if (!moved && Math.abs(dx) + Math.abs(dy) > 6){
          moved = true;
          chipEl._wasDrag = true;
          var rect2 = chipEl.getBoundingClientRect();
          chipEl.style.width = rect2.width + "px";
          document.body.appendChild(chipEl);
          chipEl.classList.add("dragging");
          if (g1.selectedChip) { g1.selectedChip.classList.remove("selected"); g1.selectedChip = null; }
        }
        if (moved){
          chipEl.style.left = (ev2.clientX - offX) + "px";
          chipEl.style.top = (ev2.clientY - offY) + "px";
          updateDragOverTile(ev2.clientX, ev2.clientY);
        }
      }
      function onUp(ev2){
        chipEl.releasePointerCapture(ev.pointerId);
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        clearDragOver();
        if (moved){
          chipEl.classList.remove("dragging");
          chipEl.style.position = ""; chipEl.style.left = ""; chipEl.style.top = ""; chipEl.style.width = "";
          var target = tileUnderPoint(ev2.clientX, ev2.clientY);
          if (origNext) origParent.insertBefore(chipEl, origNext); else origParent.appendChild(chipEl);
          if (target && !target.classList.contains("matched")){
            attemptMatch(chipEl, target);
          }
        }
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  }

  function tileUnderPoint(x, y){
    var tiles = document.querySelectorAll(".tile");
    for (var i=0;i<tiles.length;i++){
      var r = tiles[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return tiles[i];
    }
    return null;
  }
  function updateDragOverTile(x, y){
    clearDragOver();
    var t = tileUnderPoint(x, y);
    if (t && !t.classList.contains("matched")) t.classList.add("drag-over");
  }
  function clearDragOver(){
    Array.prototype.forEach.call(document.querySelectorAll(".tile.drag-over"), function(t){
      t.classList.remove("drag-over");
    });
  }

  function attemptMatch(chipEl, tileEl){
    clearDragOver();
    var chipId = chipEl.getAttribute("data-id");
    var tileId = tileEl.getAttribute("data-id");
    chipEl.classList.remove("selected");
    g1.selectedChip = null;

    if (chipId === tileId){
      var w = g1.words.filter(function(x){ return x.id === tileId; })[0];
      tileEl.classList.add("matched");
      tileEl.querySelector(".slot").textContent = w.pinyin + " · " + w.hanzi;
      var meaningEl = el('<div class="meaning">' + w.meaning + '</div>');
      tileEl.appendChild(meaningEl);
      chipEl.classList.add("matched-away");
      g1.matched++;
      document.getElementById("matchedStat").textContent = g1.matched;
      document.getElementById("progressFill").style.width = Math.round(100 * g1.matched / g1.total) + "%";
      if (g1.matched === g1.total){
        setTimeout(function(){ showCompletion(1); }, 350);
      }
    } else {
      tileEl.classList.add("wrong-flash");
      chipEl.classList.add("wrong-flash");
      setTimeout(function(){
        tileEl.classList.remove("wrong-flash");
        chipEl.classList.remove("wrong-flash");
      }, 400);
      g1.mistakes++;
      document.getElementById("missStat").textContent = g1.mistakes;
    }
  }

  /* ============ GAME 2: memory flip (사천성 스타일) ============ */
  function startGame2(){
    var words = shuffle(VOCAB).slice(0, state.wordCount);
    var cards = [];
    words.forEach(function(w){
      cards.push({word:w, type:"image"});
      cards.push({word:w, type:"pinyin"});
    });
    cards = shuffle(cards);

    g2 = {
      totalPairs: words.length,
      matchedPairs: 0,
      attempts: 0,
      startTime: Date.now(),
      flipped: [],
      locked: false
    };

    app.innerHTML =
      '<div class="game-header">' +
        '<div class="left">' +
          '<button class="icon-btn" id="backBtn">← 메인으로</button>' +
          '<button class="icon-btn" id="reshuffleBtn">🔀 다시 섞기</button>' +
        '</div>' +
        '<div class="left">' +
          '<span class="stat-pill">찾은 짝 <b id="pairStat">0</b> / ' + g2.totalPairs + '</span>' +
          '<span class="stat-pill">시도 <b id="attemptStat">0</b></span>' +
        '</div>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>' +
      '<div class="flip-grid" id="flipGrid"></div>';

    document.getElementById("backBtn").addEventListener("click", renderHome);
    document.getElementById("reshuffleBtn").addEventListener("click", startGame2);

    var grid = document.getElementById("flipGrid");
    cards.forEach(function(c, idx){
      var frontHtml = c.type === "image"
        ? '<img class="art" src="' + IMG[c.word.imgKey] + '" alt="' + c.word.meaning + '">'
        : '<div class="pinyin">' + c.word.pinyin + '</div><div class="hanzi">' + c.word.hanzi + '</div><div class="meaning">' + c.word.meaning + '</div>';
      var cardEl = el(
        '<div class="card card-type-' + c.type + '" data-id="' + c.word.id + '" data-type="' + c.type + '" data-idx="' + idx + '">' +
          '<div class="card-inner">' +
            '<div class="card-face card-back"></div>' +
            '<div class="card-face card-front">' + frontHtml + '</div>' +
          '</div>' +
        '</div>'
      );
      grid.appendChild(cardEl);
      cardEl.addEventListener("click", function(){ onCardClick(cardEl); });
    });
  }

  function onCardClick(cardEl){
    if (g2.locked) return;
    if (cardEl.classList.contains("matched")) return;
    if (cardEl.classList.contains("flipped")) return;

    cardEl.classList.add("flipped");
    g2.flipped.push(cardEl);

    if (g2.flipped.length === 2){
      g2.locked = true;
      g2.attempts++;
      document.getElementById("attemptStat").textContent = g2.attempts;
      var a = g2.flipped[0], b = g2.flipped[1];
      var isMatch = a.getAttribute("data-id") === b.getAttribute("data-id") &&
                    a.getAttribute("data-type") !== b.getAttribute("data-type");
      if (isMatch){
        setTimeout(function(){
          a.classList.add("matched"); b.classList.add("matched");
          g2.flipped = [];
          g2.locked = false;
          g2.matchedPairs++;
          document.getElementById("pairStat").textContent = g2.matchedPairs;
          document.getElementById("progressFill").style.width = Math.round(100 * g2.matchedPairs / g2.totalPairs) + "%";
          if (g2.matchedPairs === g2.totalPairs){
            setTimeout(function(){ showCompletion(2); }, 300);
          }
        }, 250);
      } else {
        a.classList.add("mismatch"); b.classList.add("mismatch");
        setTimeout(function(){
          a.classList.remove("flipped","mismatch");
          b.classList.remove("flipped","mismatch");
          g2.flipped = [];
          g2.locked = false;
        }, 750);
      }
    }
  }

  /* ============ completion overlay + confetti ============ */
  function showCompletion(mode){
    var elapsed, attemptsLabel, attemptsVal;
    if (mode === 1){
      elapsed = Date.now() - g1.startTime;
      attemptsLabel = "실수";
      attemptsVal = g1.mistakes;
    } else {
      elapsed = Date.now() - g2.startTime;
      attemptsLabel = "시도 횟수";
      attemptsVal = g2.attempts;
    }
    var overlay = el(
      '<div class="overlay">' +
        '<div class="result-card">' +
          '<div class="big-emoji">🎉</div>' +
          '<h3>모두 완성했어요!</h3>' +
          '<p class="sub">단어를 잘 기억하고 있네요.</p>' +
          '<div class="result-stats">' +
            '<div><span class="num">' + fmtTime(elapsed) + '</span><span class="lbl">걸린 시간</span></div>' +
            '<div><span class="num">' + attemptsVal + '</span><span class="lbl">' + attemptsLabel + '</span></div>' +
          '</div>' +
          '<div class="result-actions">' +
            '<button class="btn-secondary" id="toHomeBtn">메인으로</button>' +
            '<button class="btn-primary" id="retryBtn">다시 섞기</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
    document.body.appendChild(overlay);
    document.getElementById("toHomeBtn").addEventListener("click", function(){
      overlay.remove(); renderHome();
    });
    document.getElementById("retryBtn").addEventListener("click", function(){
      overlay.remove();
      if (mode === 1) startGame1(); else startGame2();
    });
    fireConfetti();
  }

  function fireConfetti(){
    var colors = ["#D6432F", "#E3A93B", "#4C9A8A", "#FBF3E3"];
    for (var i = 0; i < 46; i++){
      (function(i){
        var piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random()*100 + "vw";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDuration = (1.6 + Math.random()*1.2) + "s";
        piece.style.animationDelay = (Math.random()*0.4) + "s";
        piece.style.opacity = "0";
        document.body.appendChild(piece);
        requestAnimationFrame(function(){ piece.style.opacity = "1"; });
        setTimeout(function(){ piece.remove(); }, 3200);
      })(i);
    }
  }

  renderHome();
})();
</script>
</body>
</html>
